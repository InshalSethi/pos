---
deployment:
  tasks:
    - export DEPLOYPATH=/home/sairamua/pos-system.zedtech.co/
    - export PATH=$PATH:/usr/local/bin:/opt/cpanel/ea-nodejs18/bin
    
    # 1. Sync repository files
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp -n $DEPLOYPATH/.env.example $DEPLOYPATH/.env
    
    # 2. Frontend Assets Build
    - cd $DEPLOYPATH && npm install --no-audit
    - cd $DEPLOYPATH && npm run build
    
    # 3. Backend Dependencies & Optimization
    - cd $DEPLOYPATH && composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
    - cd $DEPLOYPATH && /usr/local/bin/php artisan migrate --force
    - cd $DEPLOYPATH && /usr/local/bin/php artisan optimize:clear
    - cd $DEPLOYPATH && /usr/local/bin/php artisan config:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan route:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan view:cache